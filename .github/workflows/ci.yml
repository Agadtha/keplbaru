name: Laravel CI/CD

on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  staging:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Staging deployment
        run: echo "Deploying to staging..."

  production:
    needs: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Production deployment
        run: |
          echo "Step 1: php artisan down --retry=60"
          echo "Step 2: git pull origin main"
          echo "Step 3: composer install --no-dev --optimize-autoloader"
          echo "Step 4: php artisan migrate --force"
          echo "Step 5: php artisan config:cache"
          echo "       php artisan route:cache"
          echo "       php artisan view:cache"
          echo "Step 6: php artisan queue:restart"
          echo "Step 7: php artisan up"