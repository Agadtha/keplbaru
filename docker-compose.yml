services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/var/www/html/database

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - app

volumes:
  sqlite_data:
